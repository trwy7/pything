[project]
name = "pything"
version = "1.3.0a1"
description = "An alternative UI for the Spotify Car Thing"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1",
    "packaging>=24.0",
    "truststore>=0.10.4",
]
authors = [
  { name = "trey", email = "trey@trey7658.com" }
]

[project.scripts]
pything = "pything.__main__:cli"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.19.0",
    "ruff>=0.17.3",
    "uv>=0.13.6",
]
