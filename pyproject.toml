[project]
name = "pything"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask==3.1.2",
    "flask-socketio==5.5.1",
    "pip-system-certs==5.3",
    "packaging>=24.0",
]

[project.scripts]
pything = "pything.__main__:cli"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.19.0",
    "ruff>=0.17.3",
    "uv>=0.13.6",
]
