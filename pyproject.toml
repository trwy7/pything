[project]
name = "pything"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask==3.1.2",
    "flask-socketio==5.5.1",
    "humanize==4.15.0",
    "pillow==12.1.1",
    "pip-system-certs==5.3",
    "psutil==7.2.2",
    "pyinstaller==6.19.0",
    "requests==2.32.5",
    "scikit-learn==1.8.0",
    "winsdk==1.0.0b10; sys_platform == 'win32'",
    "dbus-next==0.2.3; sys_platform == 'linux'",
]

[project.scripts]
pything = "pything:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
