<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="app-id" content="{{app.id}}">
    <script src="/static/app.js"></script>
    <style>
        body {
            color: white;
            font-family: Arial, Helvetica, sans-serif;
        }
        @font-face {
            font-family: 'Allo';
            src: url('/static/fonts/AlloVariable.woff2') format('woff2');
            font-weight: 100 900;
            font-style: normal;
            font-display: swap;
            size-adjust: 95%;
            ascent-override: 95%;
            descent-override: 22%;
            line-gap-override: 0%;
        }
        * {
            font-family: "Allo", Arial, Helvetica, sans-serif;
            font-variation-settings: "ROND" 50;
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    {% block content required %}{% endblock %}
    {% block script %}{% endblock %}
    <script src="/static/app.after.js"></script>
    {% for mod_html in app_mods_html %}
    {{ mod_html | safe }}
    {% endfor %}
</body>
</html>
