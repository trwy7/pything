{% extends "templates/app.html" %}
{% block head %}
<style>
    /* Layout was AI assisted */
    #song {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 75%;
        padding: 24px;
        border: 2px solid hsla(var(--custom-hue, 151), 100%, 93%, 0.6);
        border-radius: 24px;
        box-shadow: 0 10px 30px hsl(var(--custom-hue, 151), 100%, 80%, 0.08);
        flex-direction: column;
        justify-content: center;
    }

    #innersong {
        display: flex;
        margin-bottom: 5px;
    }

    #music-playbar {
        width: 100%;
        border-radius: 9999px;
        background-color: hsla(var(--custom-hue, 151), 25%, 50%, 0.8);
        transition: height 1s, margin-top 1s;
        height: 0px;
        transform: translateY(5px);
    }

    #music-playbar.show {
        height: 15px;
        margin-top: 5px;
    }

    #music-playbarinner {
        border-radius: 9999px;
        transition: width 2s;
        background: hsl(var(--custom-hue, 151), 100%, 59%);
        height: 100%;
    }

    #warn {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
    }

    #art {
        width: 200px;
        height: auto;
        max-height: 200px;
        aspect-ratio: auto;
        flex-shrink: 0;
        align-self: center;
        object-fit: contain;
        border-radius: 16px;
        border: 2px solid hsl(var(--custom-hue, 151), 100%, 85%); 
    }

    #details {
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    #title {
        font-size: 1.8rem;
        font-weight: 800;
        letter-spacing: -0.5px;
        color: hsl(var(--custom-hue, 151), 100%, 85%);
    }

    #subtitle {
        font-size: 1.3rem;
        font-weight: 700;
        color: hsl(var(--custom-hue, 151), 85%, 85%);
    }

    #album {
        font-size: 1.1rem;
        opacity: 0.8;
    }

    #artists {
        font-size: 1rem;
        font-weight: 600;
        opacity: 0.6;
    }
</style>
{% endblock %}
{% block content %}
<div id="song" style="display: none;">
    <div id="innersong">
        <img id="art">
        <div id="details">
            <span id="title"></span>
            <span id="subtitle"></span>
            <span id="album"></span>
            <span id="artists"></span>
        </div>
    </div>
    <div id="music-playbar">
        <div id="music-playbarinner" style="width: 0%;"></div>
    </div>
</div>
<div id="warn">
    No music data has been recieved. You may need to set up an audio provider in settings, or start playing something.
</div>
{% endblock %}
{% block script %}
<script>
    const musicPlaybar = document.getElementById("music-playbar")
    const musicPlaybarInner = document.getElementById("music-playbarinner")
    on("song", (song) => {
        console.log(song)
        if (song == null) {
            document.getElementById("song").style.display = "none";
            document.getElementById("warn").style.display = "block";
            return;
        }
        song.subtitle = ""
        // check for suffixes
        const suffixes = [" - ", " ("]
        for (const suffix of suffixes) {
            const index = song.title.lastIndexOf(suffix)
            if (index != -1) {
                song.subtitle = song.title.substring(index + suffix.length)
                if (suffix == " (" && song.subtitle.endsWith(")")) {
                    song.subtitle = song.subtitle.substring(0, song.subtitle.length - 1)
                }
                song.title = song.title.substring(0, index)
                break
            }
        }
        document.getElementById("song").style.display = "flex";
        document.getElementById("warn").style.display = "none";
        document.getElementById("title").innerText = song.title;
        document.getElementById("subtitle").innerText = song.subtitle;
        document.getElementById("album").innerText = song.album;
        document.getElementById("artists").innerText = song.artists;
        if (song.art) {
            document.getElementById("art").src = song.art;
            document.getElementById("art").hidden = false;
            document.getElementById("song").style.justifyContent = null;
            document.getElementById("details").style.textAlign = "left";
            document.getElementById("details").style.paddingLeft = "20px";
        } else {
            document.getElementById("art").hidden = true;
            document.getElementById("art").src = "";
            document.getElementById("song").style.justifyContent = "center";
            document.getElementById("details").style.textAlign = "center";
            document.getElementById("details").style.paddingLeft = "0px";
        }
        if (song.title == song.album) {
            document.getElementById("album").style.display = "none";
        } else {
            document.getElementById("album").style.display = "block";
        }
    })
    send("get", 0)
        window.addEventListener('message', (event) => {
        const rmsg = event.data
        if (rmsg.cmd == "music") {
            if (rmsg.data[1]) {
                musicPlaybar.classList.add("show")
                musicPlaybarInner.style.width = rmsg.data[0] + "%"
            } else {
                musicPlaybar.classList.remove("show")
            }
        }
    })
</script>
{% endblock %}
