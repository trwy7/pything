{% extends "templates/app.html" %}
{% block head %}
<style>
    body {
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

    #auto-time {
        width: 100%;
        height: 15px;
        text-align: center;
        margin-top: 5px;
        font-weight: bold;
    }

    #home {
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 1fr 1fr;
        flex: 1;
        grid-gap: 10px;
        padding-bottom: 15px;
    }

    #home > div {
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        align-items: center;
        border: solid 2px hsl(var(--custom-hue, 151), 20%, 99%);
        background: hsla(0, 0%, 40%, 0.2);
        border-radius: 20px;
        text-align: center;
        padding: 10px 0;
        transition: border-color 0.5s ease;
    }

    /* Single fill overlay for every percentstyle: the server precomputes
       --pct (height) and --opac (opacity), so fill/fade/off/solid are
       just different values, not different CSS. Height/opacity are
       transitioned directly (custom-property animation needs
       Chrome 85+, so it is not used). */
    #home > div::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: var(--pct, 0%);
        opacity: var(--opac, 0);
        background: linear-gradient(
            to top,
            hsla(var(--custom-hue, 151), 80%, 45%, 0.65),
            hsla(var(--custom-hue, 151), 80%, 40%, 0.35)
        );
        transition: height 0.5s ease, opacity 0.5s ease;
        pointer-events: none;
    }

    /* Percentage-less cards: flat solid overlay that only fades via
       opacity (no rising fill), even when percentstyle is "fill".
       Only visible when enabled (--opac > 0); disabled cards, incl.
       entities that can never be enabled (sensors), stay grey. */
    #home > div.fade::after {
        background: hsla(var(--custom-hue, 151), 70%, 45%, 0.65);
        transition: opacity 0.5s ease;
    }

    /* Keep text above the fill overlay */
    #home > div > * {
        position: relative;
        z-index: 1;
    }

    #home > div.enabled {
        border-color: hsl(var(--custom-hue, 151), 100%, 60%);
    }

    #home > div.toggleable {
        cursor: pointer;
    }

    #home .label {
        font-size: 1.2em;
        color: hsl(var(--custom-hue, 151), 100%, 92%);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        max-width: 90%;
    }

    #home .main {
        font-size: 3em;
        font-weight: bold;
    }

    #home .secondary {
        font-size: 1.5em;
        min-height: 1.2em;
    }
</style>
{% endblock %}

{% block content %}
<p id="auto-time"></p>
<div id="home">
    {% for card in initial_cards %}
    <div id="device{{ card.i + 1 }}" data-entity="{{ card.entity_id }}" class="{{ 'enabled ' if card.enabled else '' }}{{ 'fade ' if card.fade else '' }}{{ 'toggleable' if card.toggleable else '' }}" style="--pct: {{ card.pct }}%; --opac: {{ card.opac }};">
        <span class="label">{{ card.label }}</span>
        <span class="main">{{ card.state }}</span>
        <span class="secondary">{{ card.secondary }}</span>
    </div>
    {% endfor %}
</div>
{% endblock %}

{% block script %}
<script>
    // Cards carry precomputed pct/opac from the server (see fill_values),
    // so rendering is just applying values -- no per-style branching here.
    // Plain ES5-style syntax only (no post-v69 JS features).
    function renderCards(cards) {
        for (var i = 0; i < (cards || []).length; i++) {
            var card = cards[i];
            var el = document.getElementById("device" + (card.i + 1));
            if (!el) {
                continue;
            }
            if (card.entity_id) el.dataset.entity = card.entity_id;
            el.className = (card.enabled ? "enabled " : "") + (card.fade ? "fade " : "") + (card.toggleable ? "toggleable" : "");
            el.style.setProperty("--pct", card.pct + "%");
            el.style.setProperty("--opac", card.opac);
            el.querySelector(".label").textContent = card.label || "";
            el.querySelector(".main").textContent = card.state || "";
            el.querySelector(".secondary").textContent = card.secondary || "";
        }
    }

    // Click a toggleable tile to turn its device on/off (optimistic UI;
    // the server's state_changed update will confirm/correct it).
    document.getElementById("home").addEventListener("click", function (event) {
        var tile = event.target.closest("div.toggleable");
        if (!tile || !tile.dataset.entity) return;
        tile.classList.toggle("enabled");
        send("toggle", tile.dataset.entity);
    });

    on("upd", function (payload) { renderCards(payload.cards); });
    on("reload", function (payload) { window.location.reload() });
    send("refresh");
</script>
{% endblock %}
