{% extends "templates/app.html" %}
{% block head %}
<style>
    html, body {
        overflow: hidden;
        text-align: center;
        margin: 0;
        height: 100%;
        width: 100%;
        background: transparent !important;
    }
    body.unsynced {
        overflow-y: auto;
    }
    body.unsynced::-webkit-scrollbar {
        display: none;
    }
    #status {
        font-size: 2em;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
    }
    #attribution {
        position: fixed;
        bottom: 10px;
        right: 30px;
        width: 100%;
        text-align: right;
        transform: rotate(90deg);
        transform-origin: bottom right;
        color: hsla(var(--custom-hue, 151), 15%, 80%, 0.7);
        font-size: 0.9em;
        padding: 6px 0;
        z-index: 2;
    }
    #unsynced-notice {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        background-color: hsla(var(--custom-hue, 151), 40%, 20%, 0.9);
        color: hsl(var(--custom-hue, 151), 100%, 95%);
        font-size: 1.5em;
        padding: 10px 0;
    }
    body.unsynced #unsynced-notice {
        display: block;
    }
    #lyrics {
        font-size: 20px;
        transition: transform 500ms;
        transform: translateY(50vh);
        width: 100%;
        padding: 0 24px;
        display: flex;
        flex-direction: column;
        box-sizing: border-box;
    }
    .lyric-row {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        box-sizing: border-box;
        padding: 0 8px 18px;
        transition: opacity 350ms;
        opacity: 0.55;
    }
    .lyric-row.opposite {
        align-items: flex-start;
        text-align: left;
    }
    body.unsynced #lyrics {
        transform: none !important;
        padding-top: 60px;
        padding-bottom: 60px;
        min-height: 100%;
    }
    .lyric {
        display: block;
        max-width: 100%;
        transition: font-size 500ms, color 500ms;
        color: hsla(var(--custom-hue, 151), 5%, 85%, 0.7);
    }
    .lyric-row.current {
        opacity: 1;
    }
    .lyric.current {
        font-size: 25px;
        font-weight: 800;
        color: hsl(var(--custom-hue, 151), 100%, 85%);
    }
    .lyric-row.opposite .lyric.current {
        color: hsl(calc(var(--custom-hue, 151) + 90), 70%, 82%);
    }
    .lyric-background {
        display: none;
        max-width: 100%;
        color: hsla(var(--custom-hue, 151), 25%, 82%, 0.55);
        font-size: 0.78em;
        font-style: italic;
        line-height: 1.3;
        padding-top: 3px;
    }
    .lyric-background.current {
        display: block;
        color: hsla(var(--custom-hue, 151), 55%, 83%, 0.9);
    }
    body.unsynced .lyric {
        font-size: 25px;
        font-weight: 800;
        color: hsl(var(--custom-hue, 151), 5%, 90%);
    }
</style>
{% endblock %}
{% block content %}
{% if show_attribution %}<div id="attribution"></div>{% endif %}
<div id="status"></div>
<div id="unsynced-notice">Unsynced</div>
<div id="lyrics"></div>
{% endblock %}
{% block script %}
<script>
    // copilot territory
    let automove = true;
    let timedLyrics = [];
    let currentIndex = -1;
    let lyricsFrame = null;
    let timedBoundaries = [];
    let lastAppliedPosition = null;

    let basePos = 0;              // last reported position from "music"
    let playing = false;
    let lastSyncTs = performance.now();

    const lyricsInner = document.getElementById("lyrics");
    const statusDiv = document.getElementById("status");
    const attributionDiv = document.getElementById("attribution");

    on("attribution", (source) => {
        if (attributionDiv) {
            attributionDiv.textContent = source ? `Lyrics from ${source}` : "";
        }
    });

    function normalizeLine(line) {
        return line === "" ? "♬" : line;
    }

    function resetLyricsPosition() {
        lyricsInner.style.transform = "translateY(50vh)";
    }

    function setCurrentIndex(nextIndex, position) {
        let refreshActivity = lastAppliedPosition === null || position < lastAppliedPosition;
        if (!refreshActivity) {
            let lo = 0;
            let hi = timedBoundaries.length;
            while (lo < hi) {
                const mid = (lo + hi) >> 1;
                if (timedBoundaries[mid] <= lastAppliedPosition) lo = mid + 1;
                else hi = mid;
            }
            refreshActivity = lo < timedBoundaries.length && timedBoundaries[lo] <= position;
        }
        if (refreshActivity) {
            for (const line of timedLyrics) {
                const active = line.time <= position && position <= line.end;
                line.row.classList.toggle("current", active);
                line.el.classList.toggle("current", active);
                for (const background of line.backgrounds) {
                    background.el.classList.toggle(
                        "current",
                        background.time <= position && position <= background.end
                    );
                }
            }
            lastAppliedPosition = position;
        }

        if (nextIndex === currentIndex) return;
        currentIndex = nextIndex;
        if (currentIndex >= 0 && timedLyrics[currentIndex]) {
            const row = timedLyrics[currentIndex].row;
            lyricsInner.style.transform = `translateY(calc(50vh - ${row.offsetTop + row.offsetHeight / 2}px))`;
        } else {
            resetLyricsPosition();
        }
    }

    function appendTimedLine(data, container) {
        const row = document.createElement("div");
        row.className = "lyric-row";
        if (data.opposite) row.classList.add("opposite");
        if (data.speaker) row.dataset.speaker = data.speaker;

        const span = document.createElement("span");
        span.className = "lyric";
        span.textContent = normalizeLine(data.text || "");
        row.appendChild(span);

        const backgrounds = [];
        for (const vocal of data.background || []) {
            const background = document.createElement("span");
            background.className = "lyric-background";
            background.textContent = normalizeLine(vocal.text || "");
            row.appendChild(background);
            backgrounds.push({
                time: vocal.time != null ? vocal.time : data.time,
                end: vocal.end != null ? vocal.end : (data.end != null ? data.end : Infinity),
                el: background,
            });
        }
        container.appendChild(row);
        timedLyrics.push({
            time: data.time,
            end: data.end != null ? data.end : Infinity,
            row,
            el: span,
            backgrounds,
        });
    }

    function findCurrentIndexByTime(t) {
        // Binary search: last line with time <= t
        let lo = 0;
        let hi = timedLyrics.length - 1;
        let ans = -1;

        while (lo <= hi) {
            const mid = (lo + hi) >> 1;
            if (timedLyrics[mid].time <= t) {
                ans = mid;
                lo = mid + 1;
            } else {
                hi = mid - 1;
            }
        }
        return ans;
    }

    on("lyrics", (lyr) => {
        if (lyricsFrame !== null) {
            clearTimeout(lyricsFrame);
            lyricsFrame = null;
        }
        lyricsInner.innerHTML = "";
        timedLyrics = [];
        timedBoundaries = [];
        lastAppliedPosition = null;
        automove = true;
        currentIndex = -1;
        document.body.classList.remove("unsynced");
        resetLyricsPosition();

        if (typeof lyr === "string") {
            statusDiv.innerText = lyr;
            statusDiv.style.display = "block";
            lyricsInner.style.display = "none";
            return;
        }
        statusDiv.style.display = "none";
        lyricsInner.style.display = "flex";
        const fragment = document.createDocumentFragment();

        for (const rd of lyr) {
            if (typeof rd === "string") {
                automove = false;
                const span = document.createElement("span");
                span.className = "lyric";
                span.textContent = normalizeLine(rd);
                fragment.appendChild(span);
                continue;
            }

            if (Array.isArray(rd)) {
                const [time, text] = rd;
                appendTimedLine({ time, text }, fragment);
            } else {
                appendTimedLine(rd, fragment);
            }
        }
        lyricsInner.appendChild(fragment);

        timedLyrics.sort((a, b) => a.time - b.time);
        for (let i = 0; i < timedLyrics.length; i++) {
            if (timedLyrics[i].end === Infinity && i + 1 < timedLyrics.length) {
                timedLyrics[i].end = timedLyrics[i + 1].time;
            }
            const line = timedLyrics[i];
            timedBoundaries.push(line.time);
            if (Number.isFinite(line.end)) timedBoundaries.push(line.end + 1);
            for (const background of line.backgrounds) {
                timedBoundaries.push(background.time);
                if (Number.isFinite(background.end)) timedBoundaries.push(background.end + 1);
            }
        }
        timedBoundaries.sort((a, b) => a - b);

        if (!automove) {
            document.body.classList.add("unsynced");
        } else if (timedLyrics.length) {
            const now = performance.now();
            const effectivePos = basePos + (playing ? (now - lastSyncTs) : 0);
            setCurrentIndex(findCurrentIndexByTime(effectivePos), effectivePos);
        }
        scheduleLyricsTick();
    });

    on("music", (tpos) => {
        basePos = tpos[0];
        playing = tpos[1];
        lastSyncTs = performance.now();

        if (automove && timedLyrics.length) {
            const idx = findCurrentIndexByTime(basePos);
            setCurrentIndex(idx, basePos);
        }
        scheduleLyricsTick();
    });

    function scheduleLyricsTick() {
        if (lyricsFrame !== null) {
            clearTimeout(lyricsFrame);
            lyricsFrame = null;
        }
        if (!automove || !timedLyrics.length || !playing) return;

        const now = performance.now();
        const effectivePos = basePos + (now - lastSyncTs);
        let lo = 0;
        let hi = timedBoundaries.length;
        while (lo < hi) {
            const mid = (lo + hi) >> 1;
            if (timedBoundaries[mid] <= effectivePos) lo = mid + 1;
            else hi = mid;
        }
        if (lo < timedBoundaries.length) {
            lyricsFrame = setTimeout(tick, Math.max(0, timedBoundaries[lo] - effectivePos));
        }
    }

    function tick() {
        lyricsFrame = null;
        if (automove && timedLyrics.length && playing) {
            const now = performance.now();
            const effectivePos = basePos + (now - lastSyncTs);
            const idx = findCurrentIndexByTime(effectivePos);
            setCurrentIndex(idx, effectivePos);
            scheduleLyricsTick();
        }
    }
    send("open", 0);
</script>
{% endblock %}
