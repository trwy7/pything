<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- TODO: Better banner -->
  <script>
    x = setInterval(
      function() {
        fetch("http://localhost:5192/isready", { method: 'GET' })
        .then(response => {
          if (response.ok) {
            window.location.href = "http://localhost:5192/client?device=carthing";
            clearInterval(x);
          }
        })
        .catch(error => {});
      },
      1000
    )
  </script>
  <style>
    html, body {
      background-color: black;
      color: white;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }
    #load {
      position: absolute;
      z-index: 9999;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: black;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 2em;
    }
  </style>
</head>
<body>
  <div id="load">Connecting...</div>
</body>
</html>
