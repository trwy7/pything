{% extends "templates/app.html" %}
{% block head %}
<style>
    html, body {
        overflow: hidden;
        text-align: center;
        margin: 0;
        height: 100%;
        width: 100%;
    }
    body.unsynced {
        overflow-y: auto;
    }
    body.unsynced::-webkit-scrollbar {
        display: none;
    }
    #status {
        font-size: 2em;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
    }
    #unsynced-notice {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        background-color: hsla(var(--custom-hue, 151), 40%, 20%, 0.9);
        color: hsl(var(--custom-hue, 151), 100%, 95%);
        font-size: 1.5em;
        padding: 10px 0;
    }
    body.unsynced #unsynced-notice {
        display: block;
    }
    #lyrics {
        font-size: 20px;
        transition: transform 500ms;
        transform: translateY(50vh);
        width: calc(100% - 50px);
        padding: 0 25px;
        display: flex;
        flex-direction: column;
        box-sizing: border-box;
    }
    body.unsynced #lyrics {
        transform: none !important;
        padding-top: 60px;
        padding-bottom: 60px;
        min-height: 100%;
    }
    .lyric {
        transition: font-size 500ms, color 500ms;
        padding-bottom: 10px;
        color: hsla(var(--custom-hue, 151), 5%, 85%, 0.7);
    }
    .lyric.current {
        font-size: 25px;
        font-weight: 999;
        color: hsl(var(--custom-hue, 151), 100%, 85%);
    }
    body.unsynced .lyric {
        font-size: 25px;
        font-weight: 999;
        color: hsl(var(--custom-hue, 151), 5%, 90%);
    }
</style>
{% endblock %}
{% block content %}
<div id="status"></div>
<div id="unsynced-notice">Unsynced</div>
<div id="lyrics"></div>
{% endblock %}
{% block script %}
<script>
    // copilot territory
    let automove = true;
    let timedLyrics = [];
    let currentIndex = -1;
    let lyricsFrame = null;

    let basePos = 0;              // last reported position from "music"
    let playing = false;
    let lastSyncTs = performance.now();

    const lyricsInner = document.getElementById("lyrics");
    const statusDiv = document.getElementById("status");

    function normalizeLine(line) {
        return line === "" ? "♬" : line;
    }

    function resetLyricsPosition() {
        lyricsInner.style.transform = "translateY(50vh)";
    }

    function setCurrentIndex(nextIndex) {
        if (nextIndex === currentIndex) return;

        if (currentIndex >= 0 && timedLyrics[currentIndex]) {
            timedLyrics[currentIndex].el.classList.remove("current");
        }

        currentIndex = nextIndex;

        if (currentIndex >= 0 && timedLyrics[currentIndex]) {
            const el = timedLyrics[currentIndex].el;
            el.classList.add("current");
            lyricsInner.style.transform = `translateY(calc(50vh - ${el.offsetTop}px))`;
        } else {
            resetLyricsPosition();
        }
    }

    function findCurrentIndexByTime(t) {
        // Binary search: last line with time <= t
        let lo = 0;
        let hi = timedLyrics.length - 1;
        let ans = -1;

        while (lo <= hi) {
            const mid = (lo + hi) >> 1;
            if (timedLyrics[mid].time <= t) {
                ans = mid;
                lo = mid + 1;
            } else {
                hi = mid - 1;
            }
        }
        return ans;
    }

    on("lyrics", (lyr) => {
        if (lyricsFrame !== null) {
            cancelAnimationFrame(lyricsFrame);
            lyricsFrame = null;
        }
        lyricsInner.innerHTML = "";
        timedLyrics = [];
        automove = true;
        currentIndex = -1;
        document.body.classList.remove("unsynced");
        resetLyricsPosition();

        if (typeof lyr === "string") {
            statusDiv.innerText = lyr;
            statusDiv.style.display = "block";
            lyricsInner.style.display = "none";
            return;
        }
        statusDiv.style.display = "none";
        lyricsInner.style.display = "flex";

        for (const rd of lyr) {
            const span = document.createElement("span");
            span.className = "lyric";

            if (typeof rd === "string") {
                automove = false;
                span.textContent = normalizeLine(rd);
            } else {
                const [time, text] = rd;
                span.textContent = normalizeLine(text);
                timedLyrics.push({ time, el: span });
            }

            lyricsInner.appendChild(span);
        }

        if (!automove) {
            document.body.classList.add("unsynced");
        } else if (timedLyrics.length) {
            // Sync immediately for the currently known playback position
            const now = performance.now();
            const effectivePos = basePos + (playing ? (now - lastSyncTs) : 0);
            setCurrentIndex(findCurrentIndexByTime(effectivePos));
        }
        scheduleLyricsTick();
    });

    on("music", (tpos) => {
        basePos = tpos[0];
        playing = tpos[1];
        lastSyncTs = performance.now();

        if (automove && timedLyrics.length) {
            const idx = findCurrentIndexByTime(basePos);
            setCurrentIndex(idx);
        }
        scheduleLyricsTick();
    });

    function scheduleLyricsTick() {
        if (lyricsFrame === null && automove && timedLyrics.length && playing) {
            lyricsFrame = requestAnimationFrame(tick);
        }
    }

    function tick() {
        lyricsFrame = null;
        if (automove && timedLyrics.length && playing) {
            const now = performance.now();
            const effectivePos = basePos + (now - lastSyncTs);
            const idx = findCurrentIndexByTime(effectivePos);
            setCurrentIndex(idx);
            scheduleLyricsTick();
        }
    }
    send("open", 0);
</script>
{% endblock %}
