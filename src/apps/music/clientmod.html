<style>
    #music-playbar {
        position: absolute;
        bottom: 5px;
        left: 0;
        margin: 10px;
        margin-bottom: 0px;
        width: calc(100% - 20px);
        border-radius: 9999px;
        background-color: hsla(var(--custom-hue, 151), 18%, 56%, 0.6);
        height: 15px;
        transition: transform 1s;
        transform: translateY(20px);
    }
    #music-playbar.off {
        display: none;
    }
    #music-playbar.flat {
        border-radius: 0;
        bottom: 0;
        margin: 0;
    }
    #music-playbar.flat #music-playbarinner {
        border-radius: 0;
    }
    #music-playbar.show {
        transform: translateY(0px);
    }
    #music-playbarinner {
        border-radius: 9999px;
        transition: width 2s;
        /* background-color: hsl(var(--custom-hue, 151), 100%, 59%); */
        background: linear-gradient(270deg, hsl(var(--custom-hue, 151), 100%, 59%), hsl(var(--custom-hue, 151), 100%, 30%));
        height: 15px;
    }
    #appframe {
        transition: height 1s;
    }
</style>
<div id="music-playbar">
    <div id="music-playbarinner" style="width: 0%;"></div>
</div>
<script>
    const musicPlaybar = document.getElementById("music-playbar")
    const musicPlaybarInner = document.getElementById("music-playbarinner")

    function setMusicPlaybarStyle(style) {
        musicPlaybar.classList.toggle("off", style === "off")
        musicPlaybar.classList.toggle("flat", style === "flat")
        if (style === "off") {
            document.getElementById("appframe").style.height = ""
        }
    }

    setMusicPlaybarStyle("{{ app.settings['playbar_style'].get_value() }}")
    socket.on("music_playbar_style", setMusicPlaybarStyle)

    socket.on("music", (d) => {
        if (d[1]) {
            musicPlaybar.classList.add("show")
            musicPlaybarInner.style.width = d[0] + "%"
            if (musicPlaybar.classList.contains("off")) {
                document.getElementById("appframe").style.height = ""
            } else if (musicPlaybar.classList.contains("flat")) {
                document.getElementById("appframe").style.height = "calc(100% - 15px)"
            } else {
                document.getElementById("appframe").style.height = "calc(100% - 20px)"
            }
        } else {
            musicPlaybar.classList.remove("show")
            document.getElementById("appframe").style.height = ""
        }
    })
</script>
